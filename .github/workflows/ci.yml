name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Build & Test (Monorepo)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: yogi_user
          POSTGRES_PASSWORD: yogi_password
          POSTGRES_DB: yogi_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://yogi_user:yogi_password@localhost:5432/yogi_db?schema=public
      NODE_ENV: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: |
          cd apps/backend
          npx prisma generate

      - name: Push Prisma DB Schema to CI Service DB
        run: |
          cd apps/backend
          npx prisma db push --skip-generate

      - name: Run ESLint (Linting)
        run: npm run lint

      - name: Run Vitest & Supertest (Testing)
        run: npm run test

      - name: Run Turborepo Build
        run: npm run build
